name: frontend-workbench
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'ohvul/workbench/**'
      - 'tests/test_workbench.py'
      - 'pyproject.toml'
      - '.github/workflows/frontend-workbench.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[workbench]'
      - run: python -m unittest tests.test_workbench -q
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start local workbench
        run: |
          mkdir -p .cache
          python -m ohvul.workbench.launch --port 8765 --data-dir .cache/ui-ci > .cache/ui-server.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:8765/api/health && exit 0
            sleep 1
          done
          cat .cache/ui-server.log
          exit 1
      - run: npm test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-workbench-checks
          path: |
            frontend/test-results/
            .cache/ui-server.log
