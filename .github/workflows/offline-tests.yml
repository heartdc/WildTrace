name: offline-tests
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -q
      - run: python -m ohvul.performance --files 1 --lines 1
      - name: Check for credential patterns
        shell: bash
        run: |
          ! grep -RInE --exclude-dir=.git 'sk-[A-Za-z0-9_-]{20,}' .



